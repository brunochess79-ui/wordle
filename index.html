<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      background: #121213;
      color: #fff;
      min-height: 100vh;
    }

    /* ── DASHBOARD ──────────────────────────────────────────── */
    #dashboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .dash-logo {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 0.25rem;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .dash-tagline {
      color: #818384;
      font-size: 0.85rem;
      margin-bottom: 36px;
      letter-spacing: 0.1rem;
      text-transform: uppercase;
    }

    .dash-card {
      background: #1a1a1b;
      border: 1px solid #3a3a3c;
      border-radius: 12px;
      padding: 20px 24px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 14px;
    }

    .dash-card h2 {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12rem;
      text-transform: uppercase;
      color: #818384;
      margin-bottom: 12px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .dash-btn {
      flex: 1;
      padding: 12px 6px;
      border: 2px solid #3a3a3c;
      border-radius: 8px;
      background: transparent;
      color: #818384;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      line-height: 1.2;
    }

    .dash-btn span {
      font-size: 0.62rem;
      font-weight: 400;
      text-transform: none;
      color: #565758;
    }

    .dash-btn:hover { border-color: #818384; color: #fff; }

    .dash-btn.active {
      border-color: #538d4e;
      background: rgba(83,141,78,0.15);
      color: #fff;
    }

    .dash-btn.active span { color: #6aaf63; }

    #play-btn {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      background: #538d4e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.12rem;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }

    #play-btn:hover { background: #6aaf63; }

    /* ── GAME ───────────────────────────────────────────────── */
    #game {
      display: none;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 520px;
      border-bottom: 1px solid #3a3a3c;
      padding: 10px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
    }

    #back-btn {
      background: transparent;
      border: 1px solid #3a3a3c;
      border-radius: 6px;
      color: #818384;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 10px;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
      transition: all 0.15s;
    }

    #back-btn:hover { color: #fff; border-color: #818384; }

    header h1 {
      text-align: center;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.15rem;
      text-transform: uppercase;
    }

    #game-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .badge-pill {
      background: #2a2a2b;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.05rem;
      text-transform: uppercase;
      color: #818384;
      white-space: nowrap;
    }

    /* ── HINTS ──────────────────────────────────────────────── */
    #hints-container {
      width: 100%;
      max-width: 520px;
      padding: 10px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .hint-card {
      background: #1a1a1b;
      border: 1px solid #2f2f31;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hint-label {
      font-size: 0.65rem;
      color: #818384;
      font-weight: 700;
      letter-spacing: 0.06rem;
      text-transform: uppercase;
      white-space: nowrap;
      min-width: 64px;
    }

    .hint-options {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .hint-letter {
      width: 28px;
      height: 28px;
      border: 2px solid #565758;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .hint-sep {
      color: #565758;
      font-size: 0.65rem;
      font-weight: 700;
    }

    /* ── MESSAGE ────────────────────────────────────────────── */
    #message-container {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    #message {
      background: #fff;
      color: #121213;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 7px 16px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #message.show { opacity: 1; }

    /* ── BOARD ──────────────────────────────────────────────── */
    #board-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
    }

    #board { display: grid; gap: 5px; }
    .row   { display: grid; gap: 5px; }

    .tile {
      border: 2px solid #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      text-transform: uppercase;
      user-select: none;
      transition: border-color 0.05s;
    }

    .tile[data-letter] { border-color: #565758; animation: pop 0.1s ease; }
    .tile.reveal  { animation: flip 0.5s ease forwards; }
    .tile.shake   { animation: shake 0.5s ease; }
    .tile.bounce  { animation: bounce 0.1s ease; }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes flip {
      0%   { transform: rotateX(0deg); }
      49%  { transform: rotateX(90deg); }
      50%  { background: var(--reveal-bg); border-color: var(--reveal-bg); color: #fff; }
      100% { transform: rotateX(0deg); background: var(--reveal-bg); border-color: var(--reveal-bg); color: #fff; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 50%, 90% { transform: translateX(-4px); }
      30%, 70% { transform: translateX(4px); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .correct { --reveal-bg: #538d4e; background: #538d4e; border-color: #538d4e; color: #fff; }
    .present { --reveal-bg: #b59f3b; background: #b59f3b; border-color: #b59f3b; color: #fff; }
    .absent  { --reveal-bg: #3a3a3c; background: #3a3a3c; border-color: #3a3a3c; color: #fff; }

    /* ── KEYBOARD ───────────────────────────────────────────── */
    #keyboard {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: center;
    }

    .key-row { display: flex; gap: 5px; }

    .key {
      height: 54px;
      min-width: 38px;
      padding: 0 5px;
      border: none;
      border-radius: 4px;
      background: #818384;
      color: #fff;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .key:active  { filter: brightness(0.85); }
    .key.wide    { min-width: 56px; font-size: 0.68rem; }
    .key.correct { background: #538d4e; }
    .key.present { background: #b59f3b; }
    .key.absent  { background: #3a3a3c; }

    /* ── PLAY AGAIN ─────────────────────────────────────────── */
    #play-again {
      display: none;
      margin: 8px 0 16px;
      padding: 12px 28px;
      background: #538d4e;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.05rem;
    }

    #play-again:hover { background: #6aaf63; }

    @media (max-width: 360px) {
      .key { height: 46px; min-width: 30px; }
      .key.wide { min-width: 48px; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════ DASHBOARD ══════════════════════ -->
<div id="dashboard">
  <div class="dash-logo">Wordle+</div>
  <div class="dash-tagline">Choose your challenge</div>

  <div class="dash-card">
    <h2>Word Length</h2>
    <div class="btn-group" id="length-btns">
      <button class="dash-btn" data-val="4">4<br>Letters</button>
      <button class="dash-btn active" data-val="5">5<br>Letters</button>
      <button class="dash-btn" data-val="6">6<br>Letters</button>
    </div>
  </div>

  <div class="dash-card">
    <h2>Difficulty</h2>
    <div class="btn-group" id="diff-btns">
      <button class="dash-btn" data-val="easy">Easy<br><span>3 hints</span></button>
      <button class="dash-btn active" data-val="medium">Medium<br><span>1 hint</span></button>
      <button class="dash-btn" data-val="hard">Hard<br><span>No hints</span></button>
    </div>
  </div>

  <button id="play-btn">Play</button>
</div>

<!-- ══════════════════════ GAME ══════════════════════════ -->
<div id="game">
  <header>
    <button id="back-btn">← Menu</button>
    <h1>Wordle+</h1>
    <div id="game-badge">
      <span class="badge-pill" id="badge-len"></span>
      <span class="badge-pill" id="badge-diff"></span>
    </div>
  </header>

  <div id="hints-container"></div>

  <div id="message-container">
    <div id="message"></div>
  </div>

  <div id="board-container">
    <div id="board"></div>
  </div>

  <div id="keyboard"></div>

  <button id="play-again">Play Again</button>
</div>

let target, wordLen, maxRows, hintCount;
let currentRow, currentCol, gameOver, tiles, messageTimer;
let keyEls = {};

const DIFF_HINTS = { easy: 3, medium: 1, hard: 0 };
const DIFF_LABEL = { easy: 'Easy · 3 hints', medium: 'Medium · 1 hint', hard: 'Hard · No hints' };

function getAnswerList(len) {
  if (len === 4) return ANSWERS_4;
  if (len === 6) return ANSWERS_6;
  return ANSWERS_5;
}

function getValidSet(len) {
  if (len === 4) return VALID_4;
  if (len === 6) return VALID_6;
  return VALID_5;
}

function startGame() {
  wordLen   = chosenLen;
  maxRows   = wordLen === 6 ? 7 : 6;
  hintCount = DIFF_HINTS[chosenDiff];

  const answers = getAnswerList(wordLen);
  target = answers[Math.floor(Math.random() * answers.length)].toUpperCase();

  document.getElementById('dashboard').style.display = 'none';
  const gameEl = document.getElementById('game');
  gameEl.style.display = 'flex';

  document.getElementById('badge-len').textContent  = wordLen + ' letters';
  document.getElementById('badge-diff').textContent = DIFF_LABEL[chosenDiff];

  currentRow = 0;
  currentCol = 0;
  gameOver   = false;

  buildHints();
  buildBoard();
  buildKeyboard();
  document.getElementById('play-again').style.display = 'none';
  showMessage('');
}

function goToDashboard() {
  document.getElementById('game').style.display = 'none';
  document.getElementById('dashboard').style.display = 'flex';
}

// ─── Hint generation ─────────────────────────────────────────────────────────
function buildHints() {
  const container = document.getElementById('hints-container');
  container.innerHTML = '';
  if (hintCount === 0) return;

  // Pick spread-out positions (0-indexed)
  const positions = [];
  for (let i = 0; i < hintCount; i++) {
    const pos = Math.round((i + 0.5) * wordLen / hintCount - 0.5);
    positions.push(Math.min(pos, wordLen - 1));
  }

  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  positions.forEach((pos, idx) => {
    const correct = target[pos];
    // Pick 2 decoy letters (not the correct one)
    const pool = alphabet.filter(l => l !== correct);
    shuffle(pool);
    const options = shuffle([correct, pool[0], pool[1]]);

    const card = document.createElement('div');
    card.className = 'hint-card';

    const label = document.createElement('div');
    label.className = 'hint-label';
    label.textContent = 'Pos. ' + (pos + 1) + ':';
    card.appendChild(label);

    const optDiv = document.createElement('div');
    optDiv.className = 'hint-options';

    options.forEach((letter, i) => {
      if (i > 0) {
        const sep = document.createElement('span');
        sep.className = 'hint-sep';
        sep.textContent = 'or';
        optDiv.appendChild(sep);
      }
      const box = document.createElement('div');
      box.className = 'hint-letter';
      box.textContent = letter;
      optDiv.appendChild(box);
    });

    card.appendChild(optDiv);
    container.appendChild(card);
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ─── Board ───────────────────────────────────────────────────────────────────
function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  tiles = [];

  // Tile size responsive to word length
  const tileSize = wordLen === 4 ? 68 : wordLen === 5 ? 60 : 52;
  const boardW   = tileSize * wordLen + 5 * (wordLen - 1);
  const boardH   = tileSize * maxRows + 5 * (maxRows - 1);

  board.style.width  = boardW + 'px';
  board.style.height = boardH + 'px';
  board.style.gridTemplateRows = `repeat(${maxRows}, 1fr)`;

  for (let r = 0; r < maxRows; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.gridTemplateColumns = `repeat(${wordLen}, 1fr)`;
    const rowTiles = [];
    for (let c = 0; c < wordLen; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.fontSize = (tileSize * 0.46) + 'px';
      row.appendChild(tile);
      rowTiles.push(tile);
    }
    board.appendChild(row);
    tiles.push(rowTiles);
  }
}

// ─── Keyboard ────────────────────────────────────────────────────────────────
const KEY_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Enter','Z','X','C','V','B','N','M','⌫']
];

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  keyEls = {};
  KEY_ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'key-row';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener('click', () => handleKey(k));
      rowEl.appendChild(btn);
      keyEls[k] = btn;
    });
    kb.appendChild(rowEl);
  });
}

// ─── Input ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'Enter') handleKey('Enter');
  else if (e.key === 'Backspace') handleKey('⌫');
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

function handleKey(key) {
  if (gameOver) return;
  if (key === '⌫') deleteLetter();
  else if (key === 'Enter') submitGuess();
  else if (/^[A-Z]$/.test(key)) addLetter(key);
}

function addLetter(letter) {
  if (currentCol >= wordLen) return;
  const tile = tiles[currentRow][currentCol];
  tile.textContent = letter;
  tile.dataset.letter = letter;
  currentCol++;
}

function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--;
  const tile = tiles[currentRow][currentCol];
  tile.textContent = '';
  delete tile.dataset.letter;
}

function currentGuess() {
  return tiles[currentRow].map(t => t.textContent).join('');
}

// ─── Evaluation ──────────────────────────────────────────────────────────────
function getColors(guess, answer) {
  const len = answer.length;
  const result = Array(len).fill('absent');
  const ansArr = answer.split('');
  const gssArr = guess.split('');
  // Correct first
  for (let i = 0; i < len; i++) {
    if (gssArr[i] === ansArr[i]) {
      result[i] = 'correct';
      ansArr[i] = null;
      gssArr[i] = null;
    }
  }
  // Present
  for (let i = 0; i < len; i++) {
    if (gssArr[i] === null) continue;
    const idx = ansArr.indexOf(gssArr[i]);
    if (idx !== -1) {
      result[i] = 'present';
      ansArr[idx] = null;
    }
  }
  return result;
}

function submitGuess() {
  const guess = currentGuess();
  if (guess.length < wordLen) {
    shakeRow(currentRow);
    showMessage('Not enough letters');
    return;
  }
  const guessLower = guess.toLowerCase();
  const validSet   = getValidSet(wordLen);
  if (!validSet.has(guessLower)) {
    shakeRow(currentRow);
    showMessage('Not in word list');
    return;
  }

  const colors = getColors(guess, target);
  revealRow(currentRow, guess, colors, () => {
    // Update keyboard colours
    colors.forEach((color, i) => {
      const key = keyEls[guess[i]];
      if (!key) return;
      const priority = { correct: 3, present: 2, absent: 1 };
      const current  = key.dataset.state || 'none';
      if ((priority[color] || 0) > (priority[current] || 0)) {
        key.className = 'key' + (key.textContent.length > 1 ? ' wide' : '') + ' ' + color;
        key.dataset.state = color;
      }
    });

    if (colors.every(c => c === 'correct')) {
      gameOver = true;
      const msgs = ['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!','Lucky!'];
      showMessage(msgs[currentRow] || 'Nice!', 3000);
      bounceRow(currentRow);
      document.getElementById('play-again').style.display = 'inline-block';
    } else {
      currentRow++;
      currentCol = 0;
      if (currentRow >= maxRows) {
        gameOver = true;
        showMessage(target, 5000);
        document.getElementById('play-again').style.display = 'inline-block';
      }
    }
  });
}

// ─── Animations ──────────────────────────────────────────────────────────────
function revealRow(row, guess, colors, onDone) {
  tiles[row].forEach((tile, i) => {
    setTimeout(() => {
      tile.style.setProperty('--reveal-bg',
        colors[i] === 'correct' ? '#538d4e' :
        colors[i] === 'present' ? '#b59f3b' : '#3a3a3c'
      );
      tile.classList.add('reveal', colors[i]);
      if (i === wordLen - 1) setTimeout(onDone, 300);
    }, i * 300);
  });
}

function shakeRow(row) {
  tiles[row].forEach(tile => {
    tile.classList.remove('shake');
    void tile.offsetWidth;
    tile.classList.add('shake');
    tile.addEventListener('animationend', () => tile.classList.remove('shake'), { once: true });
  });
}

function bounceRow(row) {
  tiles[row].forEach((tile, i) => {
    setTimeout(() => {
      tile.classList.add('bounce');
      tile.addEventListener('animationend', () => tile.classList.remove('bounce'), { once: true });
    }, i * 100);
  });
}

// ─── Message ─────────────────────────────────────────────────────────────────
function showMessage(text, duration = 1500) {
  const el = document.getElementById('message');
  clearTimeout(messageTimer);
  if (!text) { el.classList.remove('show'); return; }
  el.textContent = text;
  el.classList.add('show');
  if (duration > 0) {
    messageTimer = setTimeout(() => el.classList.remove('show'), duration);
  }
}
</script>
