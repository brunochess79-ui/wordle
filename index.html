<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      background: #121213;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 500px;
      border-bottom: 1px solid #3a3a3c;
      padding: 12px 0;
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.15rem;
      text-transform: uppercase;
    }

    #message-container {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    #message {
      background: #fff;
      color: #121213;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #message.show { opacity: 1; }

    #board-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
      width: 350px;
      height: 420px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .tile {
      border: 2px solid #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      user-select: none;
      transition: border-color 0.05s;
    }

    .tile[data-letter] {
      border-color: #565758;
      animation: pop 0.1s ease;
    }

    .tile.reveal {
      animation: flip 0.5s ease forwards;
    }

    .tile.shake {
      animation: shake 0.5s ease;
    }

    .tile.bounce {
      animation: bounce 0.1s ease;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes flip {
      0%   { transform: rotateX(0deg); }
      49%  { transform: rotateX(90deg); }
      50%  { background: var(--reveal-bg); border-color: var(--reveal-bg); color: #fff; }
      100% { transform: rotateX(0deg); background: var(--reveal-bg); border-color: var(--reveal-bg); color: #fff; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 50%, 90% { transform: translateX(-4px); }
      30%, 70% { transform: translateX(4px); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .correct  { --reveal-bg: #538d4e; background: #538d4e; border-color: #538d4e; color: #fff; }
    .present  { --reveal-bg: #b59f3b; background: #b59f3b; border-color: #b59f3b; color: #fff; }
    .absent   { --reveal-bg: #3a3a3c; background: #3a3a3c; border-color: #3a3a3c; color: #fff; }

    #keyboard {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .key-row {
      display: flex;
      gap: 6px;
    }

    .key {
      height: 58px;
      min-width: 43px;
      padding: 0 8px;
      border: none;
      border-radius: 4px;
      background: #818384;
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .key:active { filter: brightness(0.85); }
    .key.wide { min-width: 65px; font-size: 0.75rem; }

    .key.correct { background: #538d4e; }
    .key.present { background: #b59f3b; }
    .key.absent  { background: #3a3a3c; }

    #play-again {
      display: none;
      margin-top: 16px;
      padding: 12px 28px;
      background: #538d4e;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.05rem;
    }

    #play-again:hover { background: #6aaf63; }
  </style>
</head>
<body>

  <h1>Wordle</h1>

// ─── Game state ───────────────────────────────────────────────────────────────
let target, currentRow, currentCol, gameOver, tiles, messageTimer;

function pickWord() {
  return ANSWERS[Math.floor(Math.random() * ANSWERS.length)].toUpperCase();
}

// ─── Build DOM ────────────────────────────────────────────────────────────────
function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  tiles = [];
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    const rowTiles = [];
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      row.appendChild(tile);
      rowTiles.push(tile);
    }
    board.appendChild(row);
    tiles.push(rowTiles);
  }
}

const KEY_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Enter','Z','X','C','V','B','N','M','⌫']
];

let keyEls = {};

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  keyEls = {};
  KEY_ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'key-row';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener('click', () => handleKey(k));
      rowEl.appendChild(btn);
      keyEls[k] = btn;
    });
    kb.appendChild(rowEl);
  });
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function initGame() {
  target = pickWord();
  currentRow = 0;
  currentCol = 0;
  gameOver = false;
  buildBoard();
  buildKeyboard();
  document.getElementById('play-again').style.display = 'none';
  showMessage('');
}

// ─── Input handling ───────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'Enter') handleKey('Enter');
  else if (e.key === 'Backspace') handleKey('⌫');
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

function handleKey(key) {
  if (gameOver) return;
  if (key === '⌫') deleteLetter();
  else if (key === 'Enter') submitGuess();
  else if (/^[A-Z]$/.test(key)) addLetter(key);
}

function addLetter(letter) {
  if (currentCol >= 5) return;
  const tile = tiles[currentRow][currentCol];
  tile.textContent = letter;
  tile.dataset.letter = letter;
  currentCol++;
}

function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--;
  const tile = tiles[currentRow][currentCol];
  tile.textContent = '';
  delete tile.dataset.letter;
}

function currentGuess() {
  return tiles[currentRow].map(t => t.textContent).join('');
}

// ─── Guess evaluation ─────────────────────────────────────────────────────────
function getColors(guess, answer) {
  const result = Array(5).fill('absent');
  const answerArr = answer.split('');
  const guessArr = guess.split('');
  // First pass: correct
  for (let i = 0; i < 5; i++) {
    if (guessArr[i] === answerArr[i]) {
      result[i] = 'correct';
      answerArr[i] = null;
      guessArr[i] = null;
    }
  }
  // Second pass: present
  for (let i = 0; i < 5; i++) {
    if (guessArr[i] === null) continue;
    const idx = answerArr.indexOf(guessArr[i]);
    if (idx !== -1) {
      result[i] = 'present';
      answerArr[idx] = null;
    }
  }
  return result;
}

function submitGuess() {
  const guess = currentGuess();
  if (guess.length < 5) {
    shakeRow(currentRow);
    showMessage('Not enough letters');
    return;
  }
  const guessLower = guess.toLowerCase();
  if (!VALID_GUESSES.has(guessLower) && !ANSWERS.includes(guessLower)) {
    shakeRow(currentRow);
    showMessage('Not in word list');
    return;
  }

  const colors = getColors(guess, target);
  revealRow(currentRow, guess, colors, () => {
    // Update keyboard
    colors.forEach((color, i) => {
      const letter = guess[i];
      const key = keyEls[letter];
      if (!key) return;
      const priority = { correct: 3, present: 2, absent: 1 };
      const current = key.dataset.state || 'none';
      const currentPriority = priority[current] || 0;
      if (priority[color] > currentPriority) {
        key.className = 'key' + (key.textContent.length > 1 ? ' wide' : '') + ' ' + color;
        key.dataset.state = color;
      }
    });

    if (colors.every(c => c === 'correct')) {
      gameOver = true;
      const msgs = ['Genius!','Magnificent!','Impressive!','Splendid!','Great!','Phew!'];
      showMessage(msgs[currentRow] || 'Nice!', 3000);
      bounceRow(currentRow);
      document.getElementById('play-again').style.display = 'inline-block';
    } else {
      currentRow++;
      currentCol = 0;
      if (currentRow >= 6) {
        gameOver = true;
        showMessage(target, 4000);
        document.getElementById('play-again').style.display = 'inline-block';
      }
    }
  });
}

// ─── Animations ───────────────────────────────────────────────────────────────
function revealRow(row, guess, colors, onDone) {
  const rowTiles = tiles[row];
  rowTiles.forEach((tile, i) => {
    setTimeout(() => {
      tile.style.setProperty('--reveal-bg',
        colors[i] === 'correct' ? '#538d4e' :
        colors[i] === 'present' ? '#b59f3b' : '#3a3a3c'
      );
      tile.classList.add('reveal', colors[i]);
      if (i === 4) setTimeout(onDone, 300);
    }, i * 300);
  });
}

function shakeRow(row) {
  tiles[row].forEach(tile => {
    tile.classList.remove('shake');
    void tile.offsetWidth; // reflow
    tile.classList.add('shake');
    tile.addEventListener('animationend', () => tile.classList.remove('shake'), { once: true });
  });
}

function bounceRow(row) {
  tiles[row].forEach((tile, i) => {
    setTimeout(() => {
      tile.classList.add('bounce');
      tile.addEventListener('animationend', () => tile.classList.remove('bounce'), { once: true });
    }, i * 100);
  });
}

// ─── Message ──────────────────────────────────────────────────────────────────
function showMessage(text, duration = 1500) {
  const el = document.getElementById('message');
  clearTimeout(messageTimer);
  if (!text) { el.classList.remove('show'); return; }
  el.textContent = text;
  el.classList.add('show');
  if (duration > 0) {
    messageTimer = setTimeout(() => el.classList.remove('show'), duration);
  }
}

// ─── Start ────────────────────────────────────────────────────────────────────
initGame();
</script>
